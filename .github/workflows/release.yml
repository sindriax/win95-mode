name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      # Two copies: versioned for humans browsing releases, stable so
      # /releases/latest/download/win95-mode.apk always serves the newest build
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk win95-mode-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/release/app-release.apk win95-mode.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            win95-mode-${{ github.ref_name }}.apk
            win95-mode.apk
          generate_release_notes: true
