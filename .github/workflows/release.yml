name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Without these secrets every run would sign with a freshly generated
      # debug key, breaking in-place updates for everyone (see v1 -> v2).
      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set; refusing to ship a debug-signed release." >&2
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: win95mode

      # keytool can't read v2-only signatures, hence apksigner
      - name: Print signing certificate fingerprint
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs app/build/outputs/apk/release/app-release.apk

      # Two copies: versioned for humans browsing releases, stable so
      # /releases/latest/download/win95-mode.apk always serves the newest build
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk win95-mode-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/release/app-release.apk win95-mode.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            win95-mode-${{ github.ref_name }}.apk
            win95-mode.apk
          generate_release_notes: true
